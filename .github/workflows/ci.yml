name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', '--features fake-discovery']
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: vda, POSTGRES_PASSWORD: test-password, POSTGRES_DB: vda}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U vda -d vda' --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: test-password, MYSQL_DATABASE: vda, MYSQL_USER: vda, MYSQL_PASSWORD: test-password}
        ports: ['3306:3306']
        options: --health-cmd 'mysqladmin ping -h localhost -ptest-password' --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CARGO_TARGET_DIR: target-server
      VDA_TEST_DATABASE_URL: postgres://vda:test-password@localhost:5432/vda
      VDA_TEST_POSTGRES_URL: postgres://vda:test-password@localhost:5432/vda
      VDA_TEST_PG_URL: postgres://vda:test-password@localhost:5432/vda
      VDA_TEST_MYSQL_URL: mysql://vda:test-password@localhost:3306/vda
      VDA_TEST_MYSQL_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
        with: {cache-directories: target-server}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }}
      - name: Build fake-provider gateway
        if: matrix.features != ''
        run: cargo build -p vda-server --features fake-discovery
      - name: Fake-provider API smoke
        if: matrix.features != ''
        env:
          PGPASSWORD: test-password
          VDA_DATABASE_URL: postgres://vda:test-password@localhost:5432/vda
          VDA_BIND: 127.0.0.1:8080
          VDA_COOKIE_SECURE: 'false'
          VDA_ALLOW_PRIVATE_TARGETS: 'true'
          VDA_BOOTSTRAP_ADMIN_EMAIL: admin@local.test
          VDA_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
          VDA_DISCOVERY_FAKE_FIXTURE: /tmp/vda-rds-discovery.json
          VDA_SMOKE_TARGET_PORT: '5432'
        run: |
          psql -h localhost -U vda -d vda -v ON_ERROR_STOP=1 -c 'CREATE DATABASE shop'
          psql -h localhost -U vda -d shop -v ON_ERROR_STOP=1 -f deploy/demo/postgres.sql
          psql -h localhost -U vda -d shop -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shop_reader LOGIN PASSWORD 'shop_reader_pw';
          CREATE ROLE shop_writer LOGIN PASSWORD 'shop_writer_pw';
          GRANT CONNECT ON DATABASE shop TO shop_reader, shop_writer;
          GRANT USAGE ON SCHEMA public TO shop_reader, shop_writer;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO shop_reader;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO shop_writer;
          SQL
          jq '(.resources[] | select(.identifier == "local-shop-aurora") | .port) = 5432' scripts/fixtures/rds-discovery.json > "$VDA_DISCOVERY_FAKE_FIXTURE"
          export VDA_MASTER_KEY="$(target-server/debug/visp-db-access gen-key)"
          target-server/debug/visp-db-access serve > /tmp/vda-smoke-server.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz > /dev/null; then ready=true; break; fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat /tmp/vda-smoke-server.log; exit 1; fi
            sleep 1
          done
          if [[ $ready != true ]]; then cat /tmp/vda-smoke-server.log; exit 1; fi
          bash scripts/e2e-smoke.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web
