apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vda.name" . }}
  labels:
    {{- include "vda.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vda.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vda.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vda.serviceAccountName" . | quote }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          env:
            - name: VDA_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: database-url}
            - name: VDA_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: master-key}
            {{- if .Values.bootstrapAdmin }}
            - name: VDA_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: bootstrap-admin-email}
            - name: VDA_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: bootstrap-admin-password}
            {{- end }}
            - {name: VDA_COOKIE_SECURE, value: {{ .Values.config.cookieSecure | quote }}}
            - {name: VDA_ALLOWED_CIDRS, value: {{ .Values.config.allowedCidrs | quote }}}
            - {name: VDA_TRUST_PROXY_HEADERS, value: {{ .Values.config.trustProxyHeaders | quote }}}
            - {name: VDA_TRUSTED_PROXY_CIDRS, value: {{ .Values.config.trustedProxyCidrs | quote }}}
            - {name: VDA_ALLOW_PRIVATE_TARGETS, value: {{ .Values.config.allowPrivateTargets | quote }}}
            - {name: VDA_METADATA_POOL_SIZE, value: {{ .Values.config.metadataPoolSize | quote }}}
            - {name: VDA_LOG_FORMAT, value: json}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
