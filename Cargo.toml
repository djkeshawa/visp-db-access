[workspace]
resolver = "2"
members = ["crates/vda-guard", "crates/vda-connectors", "crates/vda-server", "crates/vda-discovery"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/djkeshawa/visp-db-access"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
await_holding_lock = "deny"

[workspace.dependencies]
vda-guard = { path = "crates/vda-guard" }
vda-connectors = { path = "crates/vda-connectors" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlparser = { version = "0.63", features = ["visitor", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
rust_decimal = "1"
secrecy = { version = "0.10", features = ["serde"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-full", "cors", "request-id", "set-header", "timeout", "limit", "catch-panic", "util"] }
rust-embed = "8"
mime_guess = "2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
dashmap = "6"
moka = { version = "0.12", features = ["future"] }

vda-discovery = { path = "crates/vda-discovery" }
async-trait = "0.1"
regex = "1"
aws-config = { version = "=1.8.18", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls", "credentials-process", "sso"] }
aws-sdk-rds = { version = "=1.137.1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sts = { version = "=1.107.0", default-features = false, features = ["rt-tokio", "rustls"] }
aws-smithy-mocks = "=0.2.6"
